services:
  postgres:
    image: postgres:16-alpine
    container_name: windconfig-postgres
    environment:
      POSTGRES_DB: windconfig
      POSTGRES_USER: windconfig
      POSTGRES_PASSWORD: windconfig
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windconfig -d windconfig"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: windconfig-backend
    environment:
      APP_NAME: WindConfig AI Copilot API
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://windconfig:windconfig@postgres:5432/windconfig
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini

  frontend:
    build:
      context: ./frontend
    container_name: windconfig-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:
